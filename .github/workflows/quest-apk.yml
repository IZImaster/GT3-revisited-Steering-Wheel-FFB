name: quest-apk

# Builds the Meta Quest APK (docs/dev/VR.md): Actions > quest-apk > Run workflow, or on a push to netwheel.
on:
  workflow_dispatch:
  push:
    branches: [netwheel, netxwheel-v1]

permissions:
  contents: write # the public "quest-debug" release below

jobs:
  quest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Fetch SDL (OpenXR fork)
        run: android/fetch-sdl.sh --xr
      # The same debug key for every build (android/quest-debug.keystore, a test key, not a release
      # one), so a new APK installs over the last one (adb install -r) and keeps its settings.
      - name: Fixed debug key
        run: mkdir -p ~/.android && cp android/quest-debug.keystore ~/.android/debug.keystore
      - name: Build Quest APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -Pquest
      - uses: actions/upload-artifact@v4
        with:
          name: gt3r-quest-debug
          path: android/app/build/outputs/apk/debug/app-quest-debug.apk
      # A public download for everyone (no GitHub account needed): the "quest-debug" release,
      # its APK replaced by each build of netxwheel-v1.
      - name: Publish the quest-debug release
        if: github.ref == 'refs/heads/netxwheel-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-quest-debug.apk gt3r-quest-debug.apk
          git tag -f quest-debug && git push -f origin quest-debug
          notes="Test build for Meta Quest 3 with the network wheel (NetXWheel: https://github.com/IZImaster/NetXWheel) and 3D replays. Built from netxwheel-v1 at ${GITHUB_SHA::7}. Install: adb install -r gt3r-quest-debug.apk. You need your own GT3 A-Spec disc image."
          if gh release view quest-debug > /dev/null 2>&1; then
            gh release edit quest-debug --prerelease --title "Quest test build (network wheel)" --notes "$notes"
          else
            gh release create quest-debug --prerelease --title "Quest test build (network wheel)" --notes "$notes"
          fi
          gh release upload quest-debug gt3r-quest-debug.apk --clobber
